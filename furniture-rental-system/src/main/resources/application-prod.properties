# Production settings. Activate with SPRING_PROFILES_ACTIVE=prod

# Hibernate validates the schema against the entities. Flyway manages all DDL.
# Set DDL_AUTO=update temporarily only if Flyway validation fails during an upgrade.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Login cookies are marked Secure. Set JWT_COOKIE_SECURE=false only when testing
# this profile over plain http.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# For hosts where a proxy or load balancer terminates HTTPS
server.forward-headers-strategy=framework

# Never leak internals in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
