# Production settings. Activate with SPRING_PROFILES_ACTIVE=prod

# Hibernate keeps the schema up to date until database migrations (Flyway) are added.
# Set DDL_AUTO=validate once the schema is managed by migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Login cookies are marked Secure. Set JWT_COOKIE_SECURE=false only when testing
# this profile over plain http.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}

# For hosts where a proxy or load balancer terminates HTTPS
server.forward-headers-strategy=framework

# Never leak internals in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
