<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Checkout')}"></head>

  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container my-5">
      <h2 class="mb-4">Checkout</h2>

      <div class="row">
        <div class="col-md-8">
          <form
            th:action="@{/cart/process-checkout}"
            method="post"
            id="checkoutForm"
          >
            <div
              class="alert alert-danger"
              role="alert"
              th:if="${addressErrors != null and !addressErrors.isEmpty()}"
            >
              <ul class="mb-0">
                <li th:each="message : ${addressErrors}" th:text="${message}">
                  Error
                </li>
              </ul>
            </div>
            <div class="card mb-4">
              <div class="card-header bg-white fw-bold">
                <i class="fas fa-map-marker-alt text-primary me-2"></i>Delivery
                Address
              </div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-12">
                    <label for="addressLine1" class="form-label"
                      >Address Line 1</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="addressLine1"
                      name="addressLine1"
                      th:value="${address?.addressLine1}"
                      maxlength="200"
                      required
                    />
                  </div>
                  <div class="col-12">
                    <label for="addressLine2" class="form-label"
                      >Address Line 2 (Optional)</label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="addressLine2"
                      name="addressLine2"
                      th:value="${address?.addressLine2}"
                      maxlength="200"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="city" class="form-label">City</label>
                    <input
                      type="text"
                      class="form-control"
                      id="city"
                      name="city"
                      th:value="${address?.city}"
                      maxlength="100"
                      required
                    />
                  </div>
                  <div class="col-md-4">
                    <label for="state" class="form-label">State</label>
                    <select
                      class="form-select"
                      id="state"
                      name="state"
                      required
                    >
                      <option value="">Choose...</option>
                      <option th:selected="${address?.state == 'Delhi'}">
                        Delhi
                      </option>
                      <option th:selected="${address?.state == 'Maharashtra'}">
                        Maharashtra
                      </option>
                      <option th:selected="${address?.state == 'Karnataka'}">
                        Karnataka
                      </option>
                      <option th:selected="${address?.state == 'Tamil Nadu'}">
                        Tamil Nadu
                      </option>
                      <option th:selected="${address?.state == 'Kerala'}">
                        Kerala
                      </option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <label for="zipCode" class="form-label">PIN</label>
                    <input
                      type="text"
                      class="form-control"
                      id="zipCode"
                      name="zipCode"
                      th:value="${address?.zipCode}"
                      maxlength="6"
                      inputmode="numeric"
                      pattern="[1-9][0-9]{5}"
                      title="6-digit PIN code"
                      required
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="card mb-4">
              <div class="card-header bg-white fw-bold">
                <i class="fas fa-credit-card text-primary me-2"></i>Payment
                Method
              </div>
              <div class="card-body">
                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="paymentMethod"
                    id="online"
                    value="RAZORPAY"
                    th:checked="${razorpayEnabled}"
                    th:disabled="${!razorpayEnabled}"
                  />
                  <label class="form-check-label" for="online"
                    >Online payment (UPI or card)</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="paymentMethod"
                    id="cod"
                    value="COD"
                    th:checked="${!razorpayEnabled}"
                  />
                  <label class="form-check-label" for="cod"
                    >Cash on Delivery</label
                  >
                </div>
                <p class="text-danger mt-3 mb-0" th:unless="${razorpayEnabled}">
                  Online payment is unavailable until Razorpay keys are
                  configured.
                </p>
              </div>
            </div>

            <p
              id="paymentMessage"
              class="text-danger"
              role="status"
              aria-live="polite"
            ></p>
            <button
              type="submit"
              class="btn btn-primary btn-lg w-100 rounded-pill"
            >
              Place Order
            </button>
          </form>
        </div>

        <div class="col-md-4">
          <div class="card">
            <div class="card-header bg-white fw-bold">Order Summary</div>
            <div class="card-body">
              <ul class="list-group list-group-flush mb-3">
                <li
                  class="list-group-item d-flex justify-content-between lh-sm"
                  th:each="item : ${cart.items}"
                >
                  <div>
                    <h6 class="my-0" th:text="${item.furnitureName}">
                      Product name
                    </h6>
                    <small
                      class="text-muted"
                      th:text="${'Qty: ' + item.quantity + ' | ' + item.rentalPeriodMonths + (item.rentalPeriodMonths == 1 ? ' month' : ' months')}"
                      >Qty: 1</small
                    >
                  </div>
                  <span
                    class="text-muted"
                    th:text="${'₹' + #numbers.formatDecimal(item.pricePerMonth * item.quantity * item.rentalPeriodMonths, 1, 'COMMA', 2, 'POINT')}"
                    >₹120</span
                  >
                </li>
              </ul>
              <div class="d-flex justify-content-between mb-2">
                <span>Subtotal</span>
                <span
                  th:text="${'₹' + #numbers.formatDecimal(cart.totalPrice, 1, 'COMMA', 2, 'POINT')}"
                  >₹500</span
                >
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span th:text="'Tax (' + ${taxPercent} + '%)'">Tax (5%)</span>
                <span
                  th:text="${'₹' + #numbers.formatDecimal(cart.tax, 1, 'COMMA', 2, 'POINT')}"
                  >₹25</span
                >
              </div>
              <div class="d-flex justify-content-between border-top pt-3">
                <span class="fw-bold">Total (INR)</span>
                <strong
                  th:text="${'₹' + #numbers.formatDecimal(cart.grandTotal, 1, 'COMMA', 2, 'POINT')}"
                  >₹525</strong
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <script
      th:if="${razorpayEnabled}"
      src="https://checkout.razorpay.com/v1/checkout.js"
    ></script>
    <script th:inline="javascript">
      const checkoutForm = document.getElementById("checkoutForm");
      const paymentMessage = document.getElementById("paymentMessage");
      const placeOrderButton = checkoutForm.querySelector(
        'button[type="submit"]'
      );
      const csrfToken =
        checkoutForm.querySelector('input[name="_csrf"]')?.value || "";

      checkoutForm.addEventListener("submit", async (event) => {
        if (
          checkoutForm.querySelector('input[name="paymentMethod"]:checked')
            .value === "COD"
        ) {
          return;
        }

        event.preventDefault();
        placeOrderButton.disabled = true;
        paymentMessage.textContent = "Connecting to Razorpay...";

        try {
          const orderResponse = await fetch("/cart/create-payment-order", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              "X-XSRF-TOKEN": csrfToken,
            },
            body: new URLSearchParams(new FormData(checkoutForm)),
          });
          const order = await orderResponse.json();
          if (!orderResponse.ok) {
            throw new Error(order.message || "Unable to start payment.");
          }

          const razorpay = new Razorpay({
            key: order.keyId,
            amount: order.amount,
            currency: order.currency,
            name: "FURENTO",
            description: "Furniture rental",
            order_id: order.orderId,
            handler: async (response) => {
              try {
                paymentMessage.textContent = "Verifying payment...";
                const verificationResponse = await fetch(
                  "/cart/confirm-payment",
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/x-www-form-urlencoded",
                      "X-XSRF-TOKEN": csrfToken,
                    },
                    body: new URLSearchParams(response),
                  }
                );
                const result = await verificationResponse.json();
                if (!verificationResponse.ok) {
                  throw new Error(
                    result.message || "Payment verification failed."
                  );
                }
                window.location.assign(result.redirectUrl);
              } catch (error) {
                placeOrderButton.disabled = false;
                paymentMessage.textContent =
                  error.message || "Payment verification failed.";
              }
            },
            modal: {
              ondismiss: () => {
                placeOrderButton.disabled = false;
                paymentMessage.textContent =
                  "Payment was not completed. Your order has not been placed.";
              },
            },
          });
          razorpay.on("payment.failed", () => {
            paymentMessage.textContent = "";
          });
          razorpay.open();
        } catch (error) {
          placeOrderButton.disabled = false;
          paymentMessage.textContent =
            error.message || "Unable to start payment. Please try again.";
        }
      });
    </script>
  </body>
</html>
