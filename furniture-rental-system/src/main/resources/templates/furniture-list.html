<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Browse Furniture')}"></head>

  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="bg-primary text-white py-5 mb-4">
      <div class="container text-center">
        <h1 class="display-5 fw-bold">Browse Furniture</h1>
        <p class="lead mb-0">Search and filter our full collection.</p>
      </div>
    </div>

    <div class="container mb-5">
      <!-- Search and filters -->
      <form
        th:action="@{/furniture}"
        method="get"
        class="card border-0 shadow-sm p-3 mb-4"
      >
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-4">
            <label for="q" class="form-label small fw-bold">Search</label>
            <input
              type="search"
              class="form-control"
              id="q"
              name="q"
              maxlength="100"
              placeholder="Chair, desk, bed..."
              th:value="${filter.q}"
            />
          </div>
          <div class="col-6 col-md-2">
            <label for="category" class="form-label small fw-bold"
              >Category</label
            >
            <select class="form-select" id="category" name="category">
              <option value="">All</option>
              <option
                th:each="cat : ${categories}"
                th:value="${cat.id}"
                th:text="${cat.name}"
                th:selected="${filter.category != null and filter.category == cat.id}"
              >
                Category
              </option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label for="sort" class="form-label small fw-bold">Sort by</label>
            <select class="form-select" id="sort" name="sort">
              <option value="" th:selected="${filter.sort == null or filter.sort == ''}">
                Newest
              </option>
              <option value="priceAsc" th:selected="${filter.sort == 'priceAsc'}">
                Price: low to high
              </option>
              <option value="priceDesc" th:selected="${filter.sort == 'priceDesc'}">
                Price: high to low
              </option>
              <option value="name" th:selected="${filter.sort == 'name'}">
                Name A to Z
              </option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label for="minPrice" class="form-label small fw-bold"
              >Min price</label
            >
            <input
              type="number"
              class="form-control"
              id="minPrice"
              name="minPrice"
              min="0"
              step="1"
              th:value="${filter.minPrice}"
            />
          </div>
          <div class="col-6 col-md-2">
            <label for="maxPrice" class="form-label small fw-bold"
              >Max price</label
            >
            <input
              type="number"
              class="form-control"
              id="maxPrice"
              name="maxPrice"
              min="0"
              step="1"
              th:value="${filter.maxPrice}"
            />
          </div>
          <div class="col-12 col-md-6">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="availableOnly"
                name="availableOnly"
                value="true"
                th:checked="${filter.availableOnly == true}"
              />
              <label class="form-check-label" for="availableOnly"
                >In stock only</label
              >
            </div>
          </div>
          <div class="col-12 col-md-6 text-md-end">
            <a href="/furniture" class="btn btn-outline-secondary rounded-pill me-2"
              >Clear</a
            >
            <button type="submit" class="btn btn-primary rounded-pill px-4">
              Apply
            </button>
          </div>
        </div>
      </form>

      <p
        class="text-muted"
        th:text="${results.totalElements + (results.totalElements == 1 ? ' item' : ' items') + ' found'}"
      >
        12 items found
      </p>

      <!-- No results -->
      <div th:if="${results.empty}" class="text-center text-muted py-5">
        <i class="fas fa-box-open fa-3x mb-3 text-secondary"></i>
        <p>No furniture matches your search.</p>
        <a href="/furniture" class="btn btn-outline-primary rounded-pill mt-2"
          >Clear filters</a
        >
      </div>

      <!-- Results -->
      <div class="row g-4" th:unless="${results.empty}">
        <div class="col-6 col-lg-3" th:each="item : ${results.content}">
          <div class="card h-100 border-0 shadow-sm furniture-card">
            <div class="position-relative">
              <img
                th:src="${item.images != null and !item.images.empty ? item.images[0].imageUrl : 'https://images.unsplash.com/photo-1592078615290-033ee584e267?auto=format&fit=crop&w=800&q=80'}"
                class="card-img-top"
                th:alt="${item.name}"
                style="height: 200px; object-fit: cover"
              />
              <span
                th:if="${item.available}"
                class="position-absolute top-0 end-0 m-2 badge bg-dark"
                th:text="'Stock: ' + ${item.stockQuantity}"
                >Stock: 5</span
              >
              <span
                th:unless="${item.available}"
                class="position-absolute top-0 end-0 m-2 badge bg-danger"
                >Out of stock</span
              >
            </div>
            <div class="card-body d-flex flex-column">
              <small
                class="text-uppercase text-secondary mb-1"
                th:text="${item.category != null ? item.category.name : 'Furniture'}"
                >Category</small
              >
              <h5 class="card-title fw-bold mb-auto" th:text="${item.name}">
                Furniture item
              </h5>
              <div class="mt-3">
                <div class="mb-3">
                  <span
                    class="text-primary fw-bold fs-5"
                    th:text="${'₹' + #numbers.formatDecimal(item.rentalPricePerMonth, 1, 'COMMA', 2, 'POINT') + '/mo'}"
                    >₹50/mo</span
                  >
                </div>
                <div class="d-grid">
                  <a
                    th:href="@{'/furniture/' + ${item.id}}"
                    class="btn btn-primary rounded-pill"
                    >View Details</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <nav th:if="${results.totalPages > 1}" aria-label="Pages" class="mt-4">
        <ul class="pagination justify-content-center flex-wrap">
          <li
            class="page-item"
            th:classappend="${!results.hasPrevious()} ? 'disabled'"
          >
            <a
              class="page-link"
              th:href="${pageBaseUrl + 'page=' + (results.number - 1)}"
              >Previous</a
            >
          </li>
          <li
            class="page-item"
            th:each="p : ${#numbers.sequence(0, results.totalPages - 1)}"
            th:classappend="${p == results.number} ? 'active'"
          >
            <a
              class="page-link"
              th:href="${pageBaseUrl + 'page=' + p}"
              th:text="${p + 1}"
              >1</a
            >
          </li>
          <li
            class="page-item"
            th:classappend="${!results.hasNext()} ? 'disabled'"
          >
            <a
              class="page-link"
              th:href="${pageBaseUrl + 'page=' + (results.number + 1)}"
              >Next</a
            >
          </li>
        </ul>
      </nav>
    </div>

    <div th:replace="~{layout :: footer}"></div>
  </body>
</html>
