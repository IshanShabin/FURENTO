<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head(${category.name})}"></head>

  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <!-- Category Header -->
    <div class="bg-primary text-white py-5 mb-5">
      <div class="container text-center">
        <h1 class="display-4 fw-bold" th:text="${category.name}">
          Category Name
        </h1>
        <p class="lead" th:text="${category.description}">Description</p>
      </div>
    </div>

    <div class="container my-5">
      <!-- If no furniture exists -->
      <div th:if="${furnitureList.empty}" class="text-center text-muted py-5">
        <i class="fas fa-box-open fa-3x mb-3 text-secondary"></i>
        <p>No furniture items found in this category.</p>
        <a href="/" class="btn btn-outline-primary rounded-pill mt-3"
          >Browse All Categories</a
        >
      </div>

      <div class="row g-4" th:unless="${furnitureList.empty}">
        <div class="col-md-6 col-lg-3" th:each="item : ${furnitureList}">
          <div class="card h-100 border-0 shadow-sm furniture-card">
            <div class="position-relative">
              <img
                th:src="${!item.images.empty ? item.images[0].imageUrl : 'https://images.unsplash.com/photo-1592078615290-033ee584e267?auto=format&fit=crop&w=800&q=80'}"
                class="card-img-top"
                th:alt="${item.name}"
                style="height: 250px; object-fit: cover"
              />
              <span
                class="position-absolute top-0 end-0 m-2 badge bg-dark"
                th:text="'Stock: ' + ${item.stockQuantity}"
                >Stock: 5</span
              >
            </div>
            <div class="card-body d-flex flex-column">
              <h5 class="card-title fw-bold mb-auto" th:text="${item.name}">
                Modern Sofa
              </h5>

              <div class="mt-3">
                <div
                  class="d-flex justify-content-between align-items-center mb-3"
                >
                  <span
                    class="text-primary fw-bold fs-5"
                    th:text="${'₹' + #numbers.formatDecimal(item.rentalPricePerMonth, 1, 'COMMA', 2, 'POINT') + '/mo'}"
                    >₹50/mo</span
                  >
                </div>
                <div class="d-grid">
                  <a
                    th:href="@{'/furniture/' + ${item.id}}"
                    class="btn btn-primary rounded-pill"
                    >View Details</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
  </body>
</html>
