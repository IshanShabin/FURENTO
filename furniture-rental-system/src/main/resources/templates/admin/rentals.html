<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('All Rentals')}"></head>

  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container" style="padding: 20px">
      <h2>All Rentals</h2>

      <div
        class="alert alert-success mt-3"
        th:if="${rentalMessage}"
        th:text="${rentalMessage}"
      ></div>
      <div
        class="alert alert-warning mt-3"
        th:if="${rentalError}"
        th:text="${rentalError}"
      ></div>

      <table style="width: 100%; border-collapse: collapse; margin-top: 20px">
        <thead>
          <tr
            style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6"
          >
            <th style="padding: 12px; text-align: left">ID</th>
            <th style="padding: 12px; text-align: left">User</th>
            <th style="padding: 12px; text-align: left">Order Date</th>
            <th style="padding: 12px; text-align: left">Total Amount</th>
            <th style="padding: 12px; text-align: left">Status</th>
            <th style="padding: 12px; text-align: left">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr
            th:each="rental : ${rentals}"
            style="border-bottom: 1px solid #dee2e6"
          >
            <td style="padding: 12px" th:text="${rental.id}">1</td>
            <td
              style="padding: 12px"
              th:text="${rental.user != null ? rental.user.username : 'Unknown'}"
            >
              User
            </td>
            <td
              style="padding: 12px"
              th:text="${#temporals.format(rental.orderDate, 'yyyy-MM-dd HH:mm')}"
            >
              2024-01-01
            </td>
            <td
              style="padding: 12px"
              th:text="${'₹' + #numbers.formatDecimal(rental.totalAmount, 1, 'COMMA', 2, 'POINT')}"
            >
              ₹150.00
            </td>
            <td style="padding: 12px" th:text="${rental.status}">ACTIVE</td>
            <td style="padding: 12px">
              <form
                th:if="${rental.status == 'PENDING'}"
                th:action="@{'/admin/rentals/accept/' + ${rental.id}}"
                method="post"
                class="d-inline"
              >
                <button type="submit" class="btn btn-sm btn-success me-2">
                  Accept
                </button>
              </form>
              <form
                th:if="${rental.status == 'PENDING'}"
                th:action="@{'/admin/rentals/cancel/' + ${rental.id}}"
                method="post"
                class="d-inline"
                onsubmit="return confirm('Cancel this rental and return its items to stock?');"
              >
                <button type="submit" class="btn btn-sm btn-danger">
                  Cancel
                </button>
              </form>
              <form
                th:if="${rental.status == 'ACTIVE'}"
                th:action="@{'/admin/rentals/return/' + ${rental.id}}"
                method="post"
                class="d-inline"
                onsubmit="return confirm('Mark this rental as returned and put its items back in stock?');"
              >
                <button type="submit" class="btn btn-sm btn-primary">
                  Mark returned
                </button>
              </form>
              <span
                th:if="${rental.status == 'CANCELLED' or rental.status == 'RETURNED'}"
                class="text-muted"
                >&mdash;</span
              >
            </td>
          </tr>
        </tbody>
      </table>

      <div style="margin-top: 20px">
        <a href="/admin/dashboard" style="color: #007bff; text-decoration: none"
          >&larr; Back to Dashboard</a
        >
      </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
  </body>
</html>
