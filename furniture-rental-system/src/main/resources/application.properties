# ===============================
# SERVER
# ===============================
server.port=${PORT:8085}

# Profile used when SPRING_PROFILES_ACTIVE is not set.
# Use SPRING_PROFILES_ACTIVE=prod for deployments (see application-prod.properties).
spring.profiles.default=dev

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/springdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Razorpay credentials (use test keys during development)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.upload-dir=${FURENTO_UPLOAD_DIR:uploads/furniture}

# ===============================
# JPA / HIBERNATE
# ===============================
# Input is validated in the controllers, not again on every database write.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# ===============================
# thymeleaf
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ===============================
# HEALTH CHECK (for Docker and hosting platforms)
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ===============================
# BUSINESS DETAILS
# ===============================
app.business.name=FURENTO
app.business.address=Chengottur Street, Kottakal
app.business.phone=+91 98712 78815
app.business.email=support@furento.com
app.business.facebook=
app.business.instagram=
app.business.twitter=



# ===============================
# LOGIN PROTECTION
# ===============================
app.security.login.enabled=true
app.security.login.max-attempts-per-user=5
app.security.login.max-attempts-per-ip=20
app.security.login.window-minutes=15
# Only true behind a reverse proxy you control (EC2 setup sets TRUST_FORWARDED_FOR=true)
app.security.login.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}