# ===============================
# SERVER PORT
# ===============================

server.port = 8085

# ===============================
# DATABASE CONNECTION
# ===============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springdb
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Razorpay credentials (use test keys during development)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.upload-dir=${FURENTO_UPLOAD_DIR:uploads/furniture}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# thymeleaf
# ===============================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false 
#If you disable the Thymeleaf cache, the templates will be automatically 
#reloaded when they need to be parsed, it has to do with hot swapping your server-side templates.


# Upload limits (for images if implemented)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
