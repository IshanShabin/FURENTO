version: 2
updates:
  # Java dependencies (Maven)
  - package-ecosystem: "maven"
    directory: "/furniture-rental-system"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Moving to a new Spring Boot major version is a planned upgrade, not an automatic one
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  # Base images in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/furniture-rental-system"
    schedule:
      interval: "weekly"

  # Images in docker-compose.yml
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
